name: Build Angie (master) with OpenSSL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpcre2-dev \
            libpcre3-dev \
            zlib1g-dev \
            libbrotli-dev \
            libzstd-dev \
            git

      - name: Download sources
        run: |
          git clone --depth 1 -b openssl-4.0.1 https://github.com/openssl/openssl.git openssl-4.0.1
          git clone --depth 1 https://github.com/webserver-llc/angie.git angie-src

      - name: Configure and Compile Angie
        run: |
          cd angie-src
          ./configure \
            --prefix=/etc/angie \
            --sbin-path=/usr/sbin/angie \
            --modules-path=/usr/lib/angie/modules \
            --conf-path=/etc/angie/angie.conf \
            --error-log-path=/var/log/angie/error.log \
            --http-log-path=/var/log/angie/access.log \
            --pid-path=/run/angie.pid \
            --lock-path=/run/angie.lock \
            --http-client-body-temp-path=/var/cache/angie/client_temp \
            --http-proxy-temp-path=/var/cache/angie/proxy_temp \
            --http-fastcgi-temp-path=/var/cache/angie/fastcgi_temp \
            --http-uwsgi-temp-path=/var/cache/angie/uwsgi_temp \
            --http-scgi-temp-path=/var/cache/angie/scgi_temp \
            --user=angie \
            --group=angie \
            --with-compat \
            --with-file-aio \
            --with-threads \
            --with-http_addition_module \
            --with-http_auth_request_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_mp4_module \
            --with-http_random_index_module \
            --with-http_realip_module \
            --with-http_secure_link_module \
            --with-http_slice_module \
            --with-http_ssl_module \
            --with-http_stub_status_module \
            --with-http_sub_module \
            --with-http_v2_module \
            --with-http_v3_module \
            --with-http_acme_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-stream \
            --with-stream_realip_module \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --with-openssl=../openssl-4.0.1 \
            --with-openssl-opt='enable-zlib enable-brotli enable-zstd' \
            --with-cc-opt='-g -O2 -Werror=implicit-function-declaration -fstack-protector-strong -fstack-clash-protection -Wformat -Werror=format-security -fcf-protection -fPIC' \
            --with-ld-opt='-Wl,-z,relro -Wl,-z,now -pie -Wl,--no-as-needed -lbrotlienc -lbrotlidec -lzstd -lz'

          make -j$(nproc)

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: angie-master-openssl4
          path: angie-src/objs/angie
