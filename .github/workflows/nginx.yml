name: Build Nginx main + OpenSSL master (prebuilt GCC 16.2.0)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GCC_RELEASE: "16.2.0"
  GCC_TOOLCHAIN_RELEASE: "1.4.0"
  GCC_TRIPLET: "x86_64-focal-linux-gnu"
  GCC_TOOLCHAIN_ROOT: "/opt/x-tools/x86_64-focal-linux-gnu"
  TARGET_GLIBC: "2.39"

jobs:
  build:
    name: Build amd64 binary
    runs-on: ubuntu-24.04

    steps:
      - name: Install Nginx/OpenSSL build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # Use Ubuntu's official HTTPS archive if the runner image has Azure mirrors.
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +

          sudo apt-get update -o Acquire::Retries=3 -o Acquire::https::Timeout=15
          sudo apt-get install -y \
            build-essential \
            binutils \
            ca-certificates \
            curl \
            file \
            git \
            libbrotli-dev \
            libcrypt-dev \
            libpcre2-dev \
            libzstd-dev \
            make \
            perl \
            python3 \
            wget \
            xz-utils \
            zlib1g-dev

          test "$(uname -m)" = "x86_64"

      - name: Install prebuilt stable GCC 16.2.0 toolchain
        env:
          TOOLCHAIN_RELEASE: ${{ env.GCC_TOOLCHAIN_RELEASE }}
          TOOLCHAIN_ROOT: ${{ env.GCC_TOOLCHAIN_ROOT }}
          GCC_RELEASE: ${{ env.GCC_RELEASE }}
          GCC_TRIPLET: ${{ env.GCC_TRIPLET }}
        run: |
          set -euo pipefail
          ASSET="x-tools-${GCC_TRIPLET}-gcc16.tar.xz"
          RELEASE_API="https://api.github.com/repos/tttapa/toolchains/releases/tags/${TOOLCHAIN_RELEASE}"
          ARCHIVE_URL="https://github.com/tttapa/toolchains/releases/download/${TOOLCHAIN_RELEASE}/${ASSET}"
          ARCHIVE="$RUNNER_TEMP/${ASSET}"

          # The prebuilt bundle comes from a fixed release, not a mutable latest URL.
          # Obtain the SHA-256 published by GitHub for this exact release asset.
          curl --fail --location --retry 3 --retry-delay 2 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$RELEASE_API" -o "$RUNNER_TEMP/toolchains-release.json"

          EXPECTED_SHA256="$(python3 - "$RUNNER_TEMP/toolchains-release.json" "$ASSET" <<'PY'
          import json
          import sys
          from pathlib import Path

          release = json.loads(Path(sys.argv[1]).read_text())
          asset_name = sys.argv[2]
          asset = next((a for a in release.get("assets", []) if a.get("name") == asset_name), None)
          if asset is None:
              raise SystemExit(f"ERROR: Asset {asset_name!r} not found in pinned release")
          digest = asset.get("digest", "")
          if not digest.startswith("sha256:") or len(digest.removeprefix("sha256:")) != 64:
              raise SystemExit(f"ERROR: GitHub did not provide a valid SHA-256 digest for {asset_name}")
          print(digest.removeprefix("sha256:"))
          PY
          )"

          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$ARCHIVE" "$ARCHIVE_URL"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum --check -

          tar -tJf "$ARCHIVE" > "$RUNNER_TEMP/toolchain-archive-files.txt"
          if ! grep -Eq '^(\./)?x-tools/x86_64-focal-linux-gnu/bin/' "$RUNNER_TEMP/toolchain-archive-files.txt"; then
            echo "ERROR: Toolchain archive layout is not the expected x-tools tree" >&2
            exit 1
          fi
          # Extract as the runner user first; do not unpack a downloaded tarball as root.
          mkdir -p "$RUNNER_TEMP/toolchain-unpack"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/toolchain-unpack"
          test -x "$RUNNER_TEMP/toolchain-unpack/x-tools/x86_64-focal-linux-gnu/bin/${GCC_TRIPLET}-gcc"
          sudo mkdir -p /opt
          sudo cp -a "$RUNNER_TEMP/toolchain-unpack/x-tools" /opt/

          GCC_BIN="$TOOLCHAIN_ROOT/bin/${GCC_TRIPLET}-gcc"
          GXX_BIN="$TOOLCHAIN_ROOT/bin/${GCC_TRIPLET}-g++"
          for compiler in "$GCC_BIN" "$GXX_BIN"; do
            if [ ! -x "$compiler" ]; then
              echo "ERROR: Expected compiler executable not found: $compiler" >&2
              exit 1
            fi
          done

          # Use the prebuilt compiler, but target the runner's Ubuntu 24.04 sysroot
          # rather than the toolchain's bundled Focal sysroot. This keeps the final
          # binary's GLIBC baseline tied to Ubuntu 24.04 (GLIBC 2.39).
          WRAPPER_DIR="$RUNNER_TEMP/gcc16-wrapper-bin"
          mkdir -p "$WRAPPER_DIR"
          cat > "$WRAPPER_DIR/gcc" <<EOF
          #!/usr/bin/env bash
          exec "$GCC_BIN" --sysroot=/ "\$@"
          EOF
          cat > "$WRAPPER_DIR/g++" <<EOF
          #!/usr/bin/env bash
          exec "$GXX_BIN" --sysroot=/ "\$@"
          EOF
          chmod +x "$WRAPPER_DIR/gcc" "$WRAPPER_DIR/g++"

          echo "$WRAPPER_DIR" >> "$GITHUB_PATH"
          echo "$TOOLCHAIN_ROOT/bin" >> "$GITHUB_PATH"
          echo "GCC_WRAPPER_DIR=$WRAPPER_DIR" >> "$GITHUB_ENV"
          echo "CC=$WRAPPER_DIR/gcc" >> "$GITHUB_ENV"
          echo "CXX=$WRAPPER_DIR/g++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN_ROOT/bin/${GCC_TRIPLET}-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN_ROOT/bin/${GCC_TRIPLET}-ranlib" >> "$GITHUB_ENV"
          echo "NM=$TOOLCHAIN_ROOT/bin/${GCC_TRIPLET}-nm" >> "$GITHUB_ENV"

          export PATH="$WRAPPER_DIR:$TOOLCHAIN_ROOT/bin:$PATH"
          echo "=== Verified prebuilt GCC toolchain ==="
          gcc --version
          g++ --version
          ACTUAL_GCC="$(gcc -dumpfullversion -dumpversion)"
          if [ "$ACTUAL_GCC" != "$GCC_RELEASE" ]; then
            echo "ERROR: Expected GCC ${GCC_RELEASE}, got ${ACTUAL_GCC}" >&2
            gcc --version >&2 || true
            exit 1
          fi
          if gcc --version | grep -Eiq 'experimental|trunk|snapshot'; then
            echo "ERROR: Experimental compiler detected" >&2
            exit 1
          fi
          test "$(gcc --sysroot=/ -print-sysroot)" = "/"
          echo "Verified GCC ${ACTUAL_GCC}; system sysroot is /"

      - name: Verify compiler and static build dependencies
        run: |
          set -euo pipefail
          echo "CC=$CC"
          echo "CXX=$CXX"
          test -x "$CC"
          test -x "$CXX"
          test "$("$CC" -dumpfullversion -dumpversion)" = "${{ env.GCC_RELEASE }}"
          test "$("$CXX" -dumpfullversion -dumpversion)" = "${{ env.GCC_RELEASE }}"
          "$CC" --version
          "$CXX" --version
          if "$CC" --version | grep -Eiq 'experimental|trunk|snapshot'; then
            echo "ERROR: Experimental compiler detected" >&2
            exit 1
          fi
          test "$("$CC" -print-sysroot)" = "/"

          MULTIARCH="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          for archive in \
            "/usr/lib/${MULTIARCH}/libcrypt.a" \
            "/usr/lib/${MULTIARCH}/libpcre2-8.a" \
            "/usr/lib/${MULTIARCH}/libbrotlienc.a" \
            "/usr/lib/${MULTIARCH}/libbrotlidec.a" \
            "/usr/lib/${MULTIARCH}/libbrotlicommon.a" \
            "/usr/lib/${MULTIARCH}/libzstd.a" \
            "/usr/lib/${MULTIARCH}/libz.a"; do
            if [ ! -f "$archive" ]; then
              echo "ERROR: Required static archive not found: $archive" >&2
              exit 1
            fi
          done
          echo "OK: GCC ${GCC_RELEASE} and all required static archives are available."

      - name: Download sources
        id: sources
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openssl/openssl.git openssl-main
          git clone --depth 1 https://github.com/nginx/nginx.git nginx-main

          NGINX_COMMIT="$(git -C nginx-main rev-parse --short=12 HEAD)"
          OPENSSL_COMMIT="$(git -C openssl-main rev-parse --short=12 HEAD)"
          BUILD_DATE="$(date -u +'%Y.%m.%d')"
          TAG_NAME="v${BUILD_DATE}-${NGINX_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "nginx_commit=${NGINX_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "openssl_commit=${OPENSSL_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Configure and compile Nginx
        working-directory: nginx-main
        run: |
          set -euo pipefail
          export CC="$GCC_WRAPPER_DIR/gcc"
          export CXX="$GCC_WRAPPER_DIR/g++"

          ./auto/configure \
            --prefix=/etc/nginx \
            --sbin-path=/usr/sbin/nginx \
            --modules-path=/usr/lib/nginx/modules \
            --conf-path=/etc/nginx/nginx.conf \
            --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log \
            --pid-path=/run/nginx.pid \
            --lock-path=/run/nginx.lock \
            --http-client-body-temp-path=/var/cache/nginx/client_temp \
            --http-proxy-temp-path=/var/cache/nginx/proxy_temp \
            --http-fastcgi-temp-path=/var/cache/nginx/fastcgi_temp \
            --http-uwsgi-temp-path=/var/cache/nginx/uwsgi_temp \
            --http-scgi-temp-path=/var/cache/nginx/scgi_temp \
            --user=nginx \
            --group=nginx \
            --with-compat \
            --with-file-aio \
            --with-threads \
            --with-http_addition_module \
            --with-http_auth_request_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_mp4_module \
            --with-http_random_index_module \
            --with-http_realip_module \
            --with-http_secure_link_module \
            --with-http_slice_module \
            --with-http_ssl_module \
            --with-http_stub_status_module \
            --with-http_sub_module \
            --with-http_v2_module \
            --with-http_v3_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-stream \
            --with-stream_realip_module \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --with-openssl=../openssl-main \
            --with-openssl-opt='no-shared no-tests enable-zlib enable-brotli enable-zstd -std=gnu17 -fPIC' \
            --with-cc-opt='-std=gnu17 -g -O2 -Wno-error -Werror=implicit-function-declaration -fstack-protector-strong -fstack-clash-protection -Wformat -Werror=format-security -fcf-protection -fPIC' \
            --with-ld-opt='-Wl,-z,relro -Wl,-z,now -pie -static-libgcc -static-libstdc++ -Wl,--as-needed'

          # Nginx's OpenSSL build is static, but its optional compression
          # libraries and the system PCRE2/libcrypt/zlib libraries must also be
          # linked from static archives. Add them at the END of the final link
          # command, inside a linker group, so archive order does not matter.
          # If the upstream Makefile changes, fail instead of silently making
          # a binary with unexpected shared-library dependencies.
          MULTIARCH="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          STATIC_LIB_DIR="/usr/lib/${MULTIARCH}"
          python3 - "$STATIC_LIB_DIR" <<'PY'
          import re
          import sys
          from pathlib import Path

          libdir = Path(sys.argv[1])
          required = (
              "libpcre2-8.a",
              "libcrypt.a",
              "libz.a",
              "libbrotlienc.a",
              "libbrotlidec.a",
              "libbrotlicommon.a",
              "libzstd.a",
          )
          for name in required:
              path = libdir / name
              if not path.is_file():
                  raise SystemExit(f"ERROR: Required static archive missing: {path}")

          makefile = Path("objs/Makefile")
          text = makefile.read_text()

          # Remove the dynamic library switches emitted by Nginx's configure.
          # The corresponding .a files are appended at the end below.
          for token, label in (
              ("-lpcre2-8", "PCRE2"),
              ("-lcrypt", "libcrypt"),
              ("-lz", "zlib"),
          ):
              text, count = re.subn(
                  rf"(?<!\S){re.escape(token)}(?!\S)", "", text
              )
              if count != 1:
                  raise SystemExit(
                      f"ERROR: Expected exactly one {token} token for {label} "
                      f"in {makefile}, found {count}. Refusing unsafe link patch."
                  )

          # Locate the generated final executable link rule, then append static
          # archives after libssl.a/libcrypto.a and all Nginx objects/libraries.
          lines = text.splitlines()
          start = next(
              (i for i, line in enumerate(lines)
               if line.lstrip().startswith("$(LINK) -o objs/nginx")),
              None,
          )
          if start is None:
              raise SystemExit("ERROR: Could not locate the objs/nginx link command")

          end = start
          while end < len(lines) - 1 and lines[end].rstrip().endswith("\\"):
              end += 1
          if lines[end].rstrip().endswith("\\"):
              raise SystemExit("ERROR: Unterminated objs/nginx link command")

          archives = " ".join(str(libdir / name) for name in required)
          lines[end] = (
              lines[end].rstrip()
              + " -Wl,--start-group " + archives
              + " -Wl,--end-group -lm"
          )
          makefile.write_text("\n".join(lines) + "\n")
          print("Verified static archives and appended them after Nginx/OpenSSL libraries.")
          PY

          make -j"$(nproc)"

      - name: Verify binary and prepare release assets
        run: |
          set -euo pipefail
          BIN="nginx-main/objs/nginx"

          echo "=== ELF file ==="
          file "$BIN"

          echo "=== Dynamic dependencies (only glibc and its loader are allowed) ==="
          ldd "$BIN" | tee ldd.txt

          UNEXPECTED_DEPS="$(ldd "$BIN" | awk '
            /=>/ { print $1; next }
            /^\// { n = split($1, part, "/"); print part[n] }
          ' | grep -Ev '^(libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1|ld-linux-x86-64\.so\.2)$' || true)"

          if [ -n "$UNEXPECTED_DEPS" ]; then
            echo "ERROR: Unexpected dynamic dependencies detected:" >&2
            printf '%s\n' "$UNEXPECTED_DEPS" >&2
            exit 1
          fi
          echo "OK: No dynamic dependencies beyond glibc components and the ELF loader."

          echo "=== Maximum required GLIBC symbol version ==="
          MAX_GLIBC="$(readelf --version-info "$BIN" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
            | sed 's/^GLIBC_//' \
            | sort -Vu \
            | tail -n 1)"

          if [ -z "$MAX_GLIBC" ]; then
            echo "ERROR: Could not determine the required GLIBC version." >&2
            exit 1
          fi

          echo "Maximum required GLIBC: ${MAX_GLIBC}"
          if dpkg --compare-versions "$MAX_GLIBC" gt "$TARGET_GLIBC"; then
            echo "ERROR: Binary requires GLIBC ${MAX_GLIBC}, newer than target ${TARGET_GLIBC}." >&2
            exit 1
          fi

          echo "=== Nginx build information ==="
          "$BIN" -V 2>&1 | tee nginx-build-info.txt

          # Assert that all built-in modules enabled by the GCC 14 reference
          # workflow are still present in this GCC 16 build.
          for flag in \
            --with-compat \
            --with-file-aio \
            --with-threads \
            --with-http_addition_module \
            --with-http_auth_request_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_mp4_module \
            --with-http_random_index_module \
            --with-http_realip_module \
            --with-http_secure_link_module \
            --with-http_slice_module \
            --with-http_ssl_module \
            --with-http_stub_status_module \
            --with-http_sub_module \
            --with-http_v2_module \
            --with-http_v3_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-stream \
            --with-stream_realip_module \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --with-openssl-opt; do
            if ! grep -Fq -- "$flag" nginx-build-info.txt; then
              echo "ERROR: Expected configure flag is missing: $flag" >&2
              exit 1
            fi
          done
          for feature in enable-zlib enable-brotli enable-zstd; do
            if ! grep -Fq -- "$feature" nginx-build-info.txt; then
              echo "ERROR: OpenSSL feature is missing from the build: $feature" >&2
              exit 1
            fi
          done
          echo "OK: All built-in modules and OpenSSL compression features from the reference workflow are enabled."

          cp "$BIN" ./nginx

          echo "=== Runtime smoke test: Ubuntu 24.04 ==="
          docker run --rm --platform linux/amd64 \
            -v "$PWD/nginx:/tmp/nginx:ro" \
            ubuntu:24.04 /tmp/nginx -V

          echo "=== Runtime smoke test: Debian 13 (Trixie) ==="
          docker run --rm --platform linux/amd64 \
            -v "$PWD/nginx:/tmp/nginx:ro" \
            debian:trixie-slim /tmp/nginx -V

          tar -czf nginx-ubuntu24-debian13-amd64.tar.gz nginx
          sha256sum nginx nginx-ubuntu24-debian13-amd64.tar.gz > sha256sums.txt

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-binary-main-gcc16-prebuilt-16.2.0
          path: nginx
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.sources.outputs.tag_name }}
          name: "Nginx mainline (${{ steps.sources.outputs.nginx_commit }}) + OpenSSL master (${{ steps.sources.outputs.openssl_commit }}) — prebuilt GCC ${{ env.GCC_RELEASE }}"
          body: |
            ### Nginx mainline + OpenSSL master
            - **Compiler:** GCC ${{ env.GCC_RELEASE }} from prebuilt toolchain release ${{ env.GCC_TOOLCHAIN_RELEASE }} (SHA-256 verified; GCC is not compiled in this workflow)
            - **Statically linked:** OpenSSL, Brotli, Zstd, PCRE2, zlib, libcrypt; GCC runtimes are static where applicable.
            - **Dynamic system requirements:** glibc and its ELF loader only.
            - **Compatibility target:** GLIBC 2.39 or older symbol requirements; smoke-tested in Ubuntu 24.04 and Debian 13 (Trixie) containers.
            - **Nginx commit:** `${{ steps.sources.outputs.nginx_commit }}`
            - **OpenSSL commit:** `${{ steps.sources.outputs.openssl_commit }}`
            - GCC is pinned to stable release 16.2.0. The prebuilt toolchain is maintained by tttapa/toolchains (not an Ubuntu package). Nginx main and OpenSSL master are moving upstream branches, so those two components are not pinned to stable releases.
          files: |
            nginx
            nginx-ubuntu24-debian13-amd64.tar.gz
            sha256sums.txt
          draft: false
          prerelease: false
