name: Build Nginx main + OpenSSL master (GCC 16)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GCC_VERSION: "16"
  TARGET_GLIBC: "2.39"

jobs:
  build:
    name: Build amd64 binary
    runs-on: ubuntu-24.04

    steps:
      - name: Install GCC 16 and build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # GitHub's Ubuntu image may use the Azure mirror in DEB822 sources.
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +

          sudo apt-get update -o Acquire::Retries=3 -o Acquire::https::Timeout=15
          sudo apt-get install -y software-properties-common

          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::https::Timeout=15

          sudo apt-get install -y \
            gcc-${{ env.GCC_VERSION }} \
            g++-${{ env.GCC_VERSION }} \
            build-essential \
            binutils \
            file \
            git \
            make \
            perl \
            python3 \
            wget \
            libcrypt-dev \
            libpcre2-dev \
            zlib1g-dev \
            libbrotli-dev \
            libzstd-dev

          gcc-${{ env.GCC_VERSION }} --version
          g++-${{ env.GCC_VERSION }} --version
          test "$(uname -m)" = "x86_64"

          # Fail early if any required static archive is missing.
          MULTIARCH="$(gcc-${{ env.GCC_VERSION }} -print-multiarch)"
          for archive in \
            "/usr/lib/${MULTIARCH}/libcrypt.a" \
            "/usr/lib/${MULTIARCH}/libpcre2-8.a" \
            "/usr/lib/${MULTIARCH}/libbrotlienc.a" \
            "/usr/lib/${MULTIARCH}/libbrotlidec.a" \
            "/usr/lib/${MULTIARCH}/libbrotlicommon.a" \
            "/usr/lib/${MULTIARCH}/libzstd.a" \
            "/usr/lib/${MULTIARCH}/libz.a"; do
            if [ ! -f "$archive" ]; then
              echo "ERROR: Required static archive not found: $archive" >&2
              exit 1
            fi
          done

      - name: Download sources
        id: sources
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openssl/openssl.git openssl-main
          git clone --depth 1 https://github.com/nginx/nginx.git nginx-main

          NGINX_COMMIT="$(git -C nginx-main rev-parse --short=12 HEAD)"
          OPENSSL_COMMIT="$(git -C openssl-main rev-parse --short=12 HEAD)"
          BUILD_DATE="$(date -u +'%Y.%m.%d')"
          TAG_NAME="v${BUILD_DATE}-${NGINX_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "nginx_commit=${NGINX_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "openssl_commit=${OPENSSL_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Configure and compile Nginx
        working-directory: nginx-main
        run: |
          set -euo pipefail
          export CC="gcc-${{ env.GCC_VERSION }}"
          export CXX="g++-${{ env.GCC_VERSION }}"

          ./auto/configure \
            --prefix=/etc/nginx \
            --sbin-path=/usr/sbin/nginx \
            --modules-path=/usr/lib/nginx/modules \
            --conf-path=/etc/nginx/nginx.conf \
            --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log \
            --pid-path=/run/nginx.pid \
            --lock-path=/run/nginx.lock \
            --http-client-body-temp-path=/var/cache/nginx/client_temp \
            --http-proxy-temp-path=/var/cache/nginx/proxy_temp \
            --http-fastcgi-temp-path=/var/cache/nginx/fastcgi_temp \
            --http-uwsgi-temp-path=/var/cache/nginx/uwsgi_temp \
            --http-scgi-temp-path=/var/cache/nginx/scgi_temp \
            --user=nginx \
            --group=nginx \
            --with-compat \
            --with-file-aio \
            --with-threads \
            --with-http_addition_module \
            --with-http_auth_request_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_mp4_module \
            --with-http_random_index_module \
            --with-http_realip_module \
            --with-http_secure_link_module \
            --with-http_slice_module \
            --with-http_ssl_module \
            --with-http_stub_status_module \
            --with-http_sub_module \
            --with-http_v2_module \
            --with-http_v3_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-stream \
            --with-stream_realip_module \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --with-openssl=../openssl-main \
            --with-openssl-opt='no-shared no-tests enable-zlib enable-brotli enable-zstd -fPIC' \
            --with-cc-opt='-g -O2 -Wno-error -Werror=implicit-function-declaration -fstack-protector-strong -fstack-clash-protection -Wformat -Werror=format-security -fcf-protection -fPIC' \
            --with-ld-opt='-Wl,-z,relro -Wl,-z,now -pie -static-libgcc -static-libstdc++ -Wl,--as-needed'

          # Nginx's OpenSSL build is static, but its optional compression
          # libraries and the system PCRE2/libcrypt/zlib libraries must also be
          # linked from static archives. Add them at the END of the final link
          # command, inside a linker group, so archive order does not matter.
          # If the upstream Makefile changes, fail instead of silently making
          # a binary with unexpected shared-library dependencies.
          MULTIARCH="$(gcc-${{ env.GCC_VERSION }} -print-multiarch)"
          STATIC_LIB_DIR="/usr/lib/${MULTIARCH}"
          python3 - "$STATIC_LIB_DIR" <<'PY'
          import re
          import sys
          from pathlib import Path

          libdir = Path(sys.argv[1])
          required = (
              "libpcre2-8.a",
              "libcrypt.a",
              "libz.a",
              "libbrotlienc.a",
              "libbrotlidec.a",
              "libbrotlicommon.a",
              "libzstd.a",
          )
          for name in required:
              path = libdir / name
              if not path.is_file():
                  raise SystemExit(f"ERROR: Required static archive missing: {path}")

          makefile = Path("objs/Makefile")
          text = makefile.read_text()

          # Remove the dynamic library switches emitted by Nginx's configure.
          # The corresponding .a files are appended at the end below.
          for token, label in (
              ("-lpcre2-8", "PCRE2"),
              ("-lcrypt", "libcrypt"),
              ("-lz", "zlib"),
          ):
              text, count = re.subn(
                  rf"(?<!\S){re.escape(token)}(?!\S)", "", text
              )
              if count != 1:
                  raise SystemExit(
                      f"ERROR: Expected exactly one {token} token for {label} "
                      f"in {makefile}, found {count}. Refusing unsafe link patch."
                  )

          # Locate the generated final executable link rule, then append static
          # archives after libssl.a/libcrypto.a and all Nginx objects/libraries.
          lines = text.splitlines()
          start = next(
              (i for i, line in enumerate(lines)
               if line.lstrip().startswith("$(LINK) -o objs/nginx")),
              None,
          )
          if start is None:
              raise SystemExit("ERROR: Could not locate the objs/nginx link command")

          end = start
          while end < len(lines) - 1 and lines[end].rstrip().endswith("\\"):
              end += 1
          if lines[end].rstrip().endswith("\\"):
              raise SystemExit("ERROR: Unterminated objs/nginx link command")

          archives = " ".join(str(libdir / name) for name in required)
          lines[end] = (
              lines[end].rstrip()
              + " -Wl,--start-group " + archives
              + " -Wl,--end-group -lm"
          )
          makefile.write_text("\n".join(lines) + "\n")
          print("Verified static archives and appended them after Nginx/OpenSSL libraries.")
          PY

          make -j"$(nproc)"

      - name: Verify binary and prepare release assets
        run: |
          set -euo pipefail
          BIN="nginx-main/objs/nginx"

          echo "=== ELF file ==="
          file "$BIN"

          echo "=== Dynamic dependencies (only glibc and its loader are allowed) ==="
          ldd "$BIN" | tee ldd.txt

          UNEXPECTED_DEPS="$(ldd "$BIN" | awk '
            /=>/ { print $1; next }
            /^\// { n = split($1, part, "/"); print part[n] }
          ' | grep -Ev '^(libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1|ld-linux-x86-64\.so\.2)$' || true)"

          if [ -n "$UNEXPECTED_DEPS" ]; then
            echo "ERROR: Unexpected dynamic dependencies detected:" >&2
            printf '%s\n' "$UNEXPECTED_DEPS" >&2
            exit 1
          fi
          echo "OK: No dynamic dependencies beyond glibc components and the ELF loader."

          echo "=== Maximum required GLIBC symbol version ==="
          MAX_GLIBC="$(readelf --version-info "$BIN" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
            | sed 's/^GLIBC_//' \
            | sort -Vu \
            | tail -n 1)"

          if [ -z "$MAX_GLIBC" ]; then
            echo "ERROR: Could not determine the required GLIBC version." >&2
            exit 1
          fi

          echo "Maximum required GLIBC: ${MAX_GLIBC}"
          if dpkg --compare-versions "$MAX_GLIBC" gt "$TARGET_GLIBC"; then
            echo "ERROR: Binary requires GLIBC ${MAX_GLIBC}, newer than target ${TARGET_GLIBC}." >&2
            exit 1
          fi

          echo "=== Nginx build information ==="
          "$BIN" -V 2>&1 | tee nginx-build-info.txt

          # Assert that all built-in modules enabled by the GCC 14 reference
          # workflow are still present in this GCC 16 build.
          for flag in \
            --with-compat \
            --with-file-aio \
            --with-threads \
            --with-http_addition_module \
            --with-http_auth_request_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_mp4_module \
            --with-http_random_index_module \
            --with-http_realip_module \
            --with-http_secure_link_module \
            --with-http_slice_module \
            --with-http_ssl_module \
            --with-http_stub_status_module \
            --with-http_sub_module \
            --with-http_v2_module \
            --with-http_v3_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-stream \
            --with-stream_realip_module \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --with-openssl-opt; do
            if ! grep -Fq -- "$flag" nginx-build-info.txt; then
              echo "ERROR: Expected configure flag is missing: $flag" >&2
              exit 1
            fi
          done
          for feature in enable-zlib enable-brotli enable-zstd; do
            if ! grep -Fq -- "$feature" nginx-build-info.txt; then
              echo "ERROR: OpenSSL feature is missing from the build: $feature" >&2
              exit 1
            fi
          done
          echo "OK: All built-in modules and OpenSSL compression features from the reference workflow are enabled."

          cp "$BIN" ./nginx

          echo "=== Runtime smoke test: Ubuntu 24.04 ==="
          docker run --rm --platform linux/amd64 \
            -v "$PWD/nginx:/tmp/nginx:ro" \
            ubuntu:24.04 /tmp/nginx -V

          echo "=== Runtime smoke test: Debian 13 (Trixie) ==="
          docker run --rm --platform linux/amd64 \
            -v "$PWD/nginx:/tmp/nginx:ro" \
            debian:trixie-slim /tmp/nginx -V

          tar -czf nginx-ubuntu24-debian13-amd64.tar.gz nginx
          sha256sum nginx nginx-ubuntu24-debian13-amd64.tar.gz > sha256sums.txt

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-binary-main-gcc16
          path: nginx
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.sources.outputs.tag_name }}
          name: "Nginx mainline (${{ steps.sources.outputs.nginx_commit }}) + OpenSSL master (${{ steps.sources.outputs.openssl_commit }})"
          body: |
            ### Nginx mainline + OpenSSL master
            - **Compiler:** GCC ${{ env.GCC_VERSION }}
            - **Statically linked:** OpenSSL, Brotli, Zstd, PCRE2, zlib, libcrypt; GCC runtimes are static where applicable.
            - **Dynamic system requirements:** glibc and its ELF loader only.
            - **Compatibility target:** GLIBC 2.39 or older symbol requirements; smoke-tested in Ubuntu 24.04 and Debian 13 (Trixie) containers.
            - **Nginx commit:** `${{ steps.sources.outputs.nginx_commit }}`
            - **OpenSSL commit:** `${{ steps.sources.outputs.openssl_commit }}`
            - This is a build from moving upstream branches; it is not a stable release build.
          files: |
            nginx
            nginx-ubuntu24-debian13-amd64.tar.gz
            sha256sums.txt
          draft: false
          prerelease: false
