name: Build Nginx (main) with OpenSSL (master) & GCC 14
on: [workflow_dispatch]

jobs:
  build:
    # ubuntu-22.04 (GLIBC 2.35) гарантирует запуск на Ubuntu 22.04, 24.04, Debian 12 и Debian 13
    runs-on: ubuntu-22.04

    steps:
      - name: Install Latest GCC and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14 \
            g++-14 \
            build-essential \
            libpcre2-dev \
            zlib1g-dev \
            libbrotli-dev \
            libzstd-dev \
            git \
            wget

          # Назначаем GCC 14 компилятором по умолчанию
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          gcc --version

      - name: Download sources
        run: |
          git clone --depth 1 https://github.com/openssl/openssl.git openssl-main
          git clone --depth 1 https://github.com/nginx/nginx.git nginx-main

      - name: Configure and Compile Nginx
        run: |
          cd nginx-main
          export CC=gcc-14
          export CXX=g++-14

          ./auto/configure \
            --prefix=/etc/nginx \
            --sbin-path=/usr/sbin/nginx \
            --modules-path=/usr/lib/nginx/modules \
            --conf-path=/etc/nginx/nginx.conf \
            --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log \
            --pid-path=/run/nginx.pid \
            --lock-path=/run/nginx.lock \
            --http-client-body-temp-path=/var/cache/nginx/client_temp \
            --http-proxy-temp-path=/var/cache/nginx/proxy_temp \
            --http-fastcgi-temp-path=/var/cache/nginx/fastcgi_temp \
            --http-uwsgi-temp-path=/var/cache/nginx/uwsgi_temp \
            --http-scgi-temp-path=/var/cache/nginx/scgi_temp \
            --user=nginx \
            --group=nginx \
            --with-compat \
            --with-file-aio \
            --with-threads \
            --with-http_addition_module \
            --with-http_auth_request_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_mp4_module \
            --with-http_random_index_module \
            --with-http_realip_module \
            --with-http_secure_link_module \
            --with-http_slice_module \
            --with-http_ssl_module \
            --with-http_stub_status_module \
            --with-http_sub_module \
            --with-http_v2_module \
            --with-http_v3_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-stream \
            --with-stream_realip_module \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --with-openssl=../openssl-main \
            --with-openssl-opt='enable-zlib enable-brotli enable-zstd' \
            --with-cc-opt='-g -O2 -Werror=implicit-function-declaration -fstack-protector-strong -fstack-clash-protection -Wformat -Werror=format-security -fcf-protection -fPIC' \
            --with-ld-opt='-Wl,-z,relro -Wl,-z,now -pie -static-libgcc -Wl,--no-as-needed -lbrotlienc -lbrotlidec -lzstd -lz'

          make -j$(nproc)

      - name: Check binary requirements
        run: |
          echo "=== Проверка зависимостей GLIBC ==="
          objdump -p nginx-main/objs/nginx | grep -A 10 "required from libc.so" || true

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-binary-main
          path: nginx-main/objs/nginx
